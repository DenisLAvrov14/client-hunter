# Global application settings.
operator_timezone: Asia/Tbilisi
review_time_local: "10:00"         # morning review queue in Telegram
summary_time_local: "20:00"        # evening summary
queue_score_threshold: 60          # spec 5.5: min score to reach the operator
data_dir: data
db_file: data/client-hunter.sqlite
backups_keep: 14
# spec 8.2: honest bot identity with a contact. Swap the URL for the bot page on your domain once it exists.
user_agent: "ClientHunterBot/0.1 (+https://github.com/DenisLAvrov14/client-hunter)"
robots_token: ClientHunterBot   # name matched against robots.txt User-agent groups
