# Per-run limits (spec 6.2). Exceeding a limit stops the stage and alerts the operator.
max_companies_per_run: 100
max_pages_per_site: 6
request_timeout_ms: 15000
max_response_bytes: 5242880      # 5 MB, spec 19
max_redirects: 5
per_domain_delay_ms: 3000
max_concurrent_sites: 3
max_llm_calls_per_run: 60
max_llm_cost_usd_per_run: 3
max_llm_cost_usd_per_month: 40
max_queue_per_day: 10
max_nav_links_checked: 10        # BROKEN_INTERNAL_LINKS; spec allows up to 20
overpass_timeout_s: 120
page_main_text_max_chars: 4000   # cleaned main content saved per page (pages.main_text)
page_links_max: 40               # internal links saved per page, for targeted extra pages later
