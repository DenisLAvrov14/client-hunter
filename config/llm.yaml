# Models and token prices (USD per 1M tokens).
# Prices from Anthropic pricing as of 2026-10-06; re-check before Phase 2 (see docs/verification-log.md).
models:
  classify: claude-haiku-5-5     # L1 classifyBusiness, L3 classifyReply
  dossier: claude-sonnet-5-5     # L2 buildDossier

prices:
  claude-haiku-5-5:              # prompts <= 100K tokens; we never exceed that
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50

budget_warn_ratio: 0.8           # spec 9.5: warn at 80% of the monthly limit
