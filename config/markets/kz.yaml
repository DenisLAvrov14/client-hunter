# spec 3.6. Same profile as RU until the advertising-law check is done.
code: KZ
enabled: true                   # discovery only; sending stays blocked by legal_review_done
legal_review_done: false
requires_manual_legal_review: true
language: ru
timezone: Asia/Almaty
currency: KZT
# days: ISO weekdays (1 = Mon). Tue–Fri is a hypothesis (spec 3.7).
send_window_local: { days: [2, 3, 4, 5], from: "10:00", to: "16:00" }
daily_cap: 8
first_touch_mode: permission_request
followups: 1
followup_delays_days: [5]
require_corporate_entity: true
require_registry_check: false
allow_named_business_address: false
allow_freemail_addresses: false
entity_markers_allow: ["ТОО", "АО"]
entity_markers_deny: ["ИП"]
registry: none
discovery_cities: ["Алматы", "Астана"]          # OSM names; Karaganda not found under its common spellings
cold_email_baseline: unverified              # advertising law not checked yet (spec 3.6)
